{% load static %}
<!DOCTYPE html>
<html class="h-full bg-gray-900" lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    /* =============== FONT AND TYPOGRAPHY =============== */
    body {
      font-family: "Montserrat Alternates", sans-serif;
      font-size: 1.5rem;
    }
  </style>
</head>
<body class="h-full">
<div class="flex min-h-full flex-col justify-center px-6 py-12 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-sm"
       style="text-align: center; font-size: 1.5rem; font-style: inherit">
    <a href="{% url 'index' %}" style="color: white">Sustent<span style="color: #7EFF2A">Agro</span></a>
  </div>

  <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-sm">
    <!-- form django -->
    <form class="space-y-6" method="POST">
      {% csrf_token %}
      <div>
        <label class="block text-sm/6 font-medium text-white"
               for="{{ form.username.id_for_label }}">Usuário</label>
        <div class="mt-2">
          <input
            class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6"
            id="{{ form.username.id_for_label }}"
            name="{{ form.username.name }}"
            placeholder="Digite seu usuário"
            type="text"
            value="{{ form.username.value|default:'' }}"
          >
          {% if form.username.errors %}
            <div class="text-red-500 text-sm mt-2">
              {{ form.username.errors }}
            </div>
          {% endif %}
        </div>
      </div>

      <div>
        <div class="flex items-center justify-between">
          <label class="block text-sm/6 font-medium text-white"
                 for="{{ form.password.id_for_label }}">Senha</label>
          <!--          <div class="text-sm">-->
          <!--            <a href="#" class="font-semibold text-indigo-600 hover:text-indigo-500">Forgot password?</a>-->
          <!--          </div>-->
        </div>
        <div class="mt-2">
          <input
            type="password"
            name="password"
            id="{{ form.password.id_for_label }}"
            class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6"
            placeholder="Digite sua senha"
            required
          >
          {% if form.password.errors %}
            <div class="text-red-500 text-sm mt-2">
              {{ form.password.errors }}
            </div>
          {% endif %}
        </div>
      </div>

      {% if form.non_field_errors %}
        <div class="bg-red-100 text-red-700 p-3 rounded-lg">
            {{ form.non_field_errors }}
        </div>
      {% endif %}

      <div>
        <button
          type="submit"
          class="flex w-full justify-center rounded-md bg-indigo-600 px-3 py-1.5 text-sm/6 font-semibold text-white shadow-xs hover:bg-indigo-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">
          Entrar
        </button>
      </div>
    </form>
  </div>
</div>
</body>
</html>
